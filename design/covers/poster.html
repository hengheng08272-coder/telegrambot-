<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:600px;height:900px;overflow:hidden;background:#060A14}
.scale{transform:scale(1.5);transform-origin:top left}
.f{position:relative;width:400px;height:600px;overflow:hidden;background:#060A14;
   font-family:Battambang,system-ui,sans-serif;color:#EEF1F8}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.sc{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,20,.1) 0%,rgba(6,10,20,0) 34%,rgba(6,10,20,.72) 74%,#060A14 100%)}
.lg{position:absolute;left:22px;top:22px;width:34px;height:34px;border-radius:8px;z-index:3}
.bot{position:absolute;left:22px;right:22px;bottom:26px;z-index:3}
.nb{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:4px;
    color:#FF6B60;background:rgba(230,35,31,.18);box-shadow:inset 0 0 0 1px rgba(230,35,31,.45);
    font-size:11px;font-weight:700}
.wm{font-family:Anton,sans-serif;font-size:40px;line-height:1;margin-top:12px;letter-spacing:.01em}
.mt{margin-top:8px;font-size:13px;font-weight:700;color:rgba(255,255,255,.55)}
</style></head><body><div class="scale"><div class="f">
  <img class="art" src="art.jpg" alt=""><div class="sc"></div>
  <img class="lg" src="logo.png" alt="">
  <div class="bot">
    <span class="nb">● ចេញថ្មីៗ</span>
    <div class="wm">NINT<span style="color:#E6231F">PLEX</span></div>
    <div class="mt">អត្ថបទជាខ្មែរ · ភាពច្បាស់លម្អិត</div>
  </div>
</div></div></body></html>
