<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:900px;overflow:hidden;background:#060A14}
.scale{transform:scale(2);transform-origin:top left}
.f{position:relative;width:800px;height:450px;overflow:hidden;background:#060A14;
   font-family:Battambang,system-ui,sans-serif;color:#EEF1F8}
.art{position:absolute;right:0;top:0;width:470px;height:100%;object-fit:cover;object-position:50% 6%;
     -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26%);
     mask-image:linear-gradient(90deg,transparent 0,#000 26%)}
.s1{position:absolute;inset:0;background:linear-gradient(90deg,#060A14 0%,rgba(6,10,20,.85) 22%,transparent 58%)}
.s2{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,20,.25),rgba(6,10,20,.55))}
.blk{position:absolute;left:56px;top:50%;transform:translateY(-50%);z-index:3}
.lg{display:flex;align-items:center;gap:14px}
.lg img{width:46px;height:46px;border-radius:10px;display:block}
.wm{font-family:Anton,sans-serif;font-size:26px;letter-spacing:.02em;line-height:1}
.rd{width:44px;height:3px;background:#E6231F;margin:16px 0 14px}
.tag{font-size:15px;line-height:1.85;color:#C7CEDD;max-width:290px}
.btns{display:flex;gap:10px;margin-top:20px}
.b1{height:44px;padding:0 18px;border-radius:8px;display:flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,#2050D8,#1A3FAE 55%,#0E2560);font-size:14px;font-weight:700}
.b2{height:44px;padding:0 16px;border-radius:8px;display:flex;align-items:center;gap:7px;
    color:#F5C563;background:rgba(245,197,99,.14);box-shadow:inset 0 0 0 1px rgba(245,197,99,.4);
    font-size:14px;font-weight:700}
</style></head><body><div class="scale"><div class="f">
  <img class="art" src="art.jpg" alt="">
  <div class="s1"></div><div class="s2"></div>
  <div class="blk">
    <div class="lg"><img src="logo.png" alt=""><span class="wm">NINT<span style="color:#E6231F">PLEX</span></span></div>
    <div class="rd"></div>
    <div class="tag">រឿងភាគចិន និង donghua<br>អត្ថបទជាខ្មែរ · ភាពច្បាស់លម្អិត</div>
    <div class="btns"><span class="b1">▶ មើលឥឡូវ</span><span class="b2">♛ សមាជិក</span></div>
  </div>
</div></div></body></html>
