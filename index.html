<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A101E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NINT VIP" />
    <!-- initial-scale=1, not 0.85. The old value zoomed the whole app out
         to 85%, which is why every label read as "too small": an 11px
         line was landing on the glass at about 9px. The layout is sized
         for a real phone viewport now instead of a pretend wider one. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&family=Poppins:wght@500;600;700;800&family=Anton&display=swap"
      rel="stylesheet"
    />
    <!-- Checkout design tokens. Shared verbatim with the standalone
         Safari payment page (public/pay/index.html) so the in-app sheet
         and the browser page are visibly one product. -->
    <link rel="stylesheet" href="/checkout-theme.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>NINT VIP — Mini App</title>
    <meta name="description" content="NINT VIP — Telegram Mini App សម្រាប់សមាជិក VIP មើលបានគ្រប់វគ្គ ២៤ម៉ោង។" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
