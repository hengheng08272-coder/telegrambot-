<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0D" />
<meta name="robots" content="noindex" />
<title>ទូទាត់ — NINT ANIME VIP</title>
<link rel="icon" type="image/png" href="/assets/images/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&family=Anton&display=swap" rel="stylesheet" />
<!-- The same tokens the in-app payment sheet is built from, loaded from
     the same file, so this page and the sheet are visibly one product. -->
<link rel="stylesheet" href="/checkout-theme.css" />
<!--
  Standalone checkout page, opened in the SYSTEM browser (Safari), not in
  Telegram's WebView.

  Why it exists: inside Telegram the Mini App runs in Telegram's own
  WebView, which routinely swallows a navigation to a non-http scheme. The
  abamobilebank:// deeplink therefore behaves "like text, not a link"
  there. Telegram's WebApp.openLink() does hand an https URL to the system
  browser, so the Mini App opens THIS page with openLink(), and the viewer
  taps the deeplink from Safari — where iOS honours it and launches ABA.

  Plain HTML on purpose: it must work with no bundler, no framework and no
  network call beyond its own assets. Everything it shows comes from the
  query string, and all of it is data the QR already encodes publicly.

  Params: khqr, qr, plan, amount, ticket, name, pay, ret, lang
-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { background: var(--co-bg); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    padding: 12px 14px calc(16px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: var(--co-bg);
    background-image: var(--co-backdrop);
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--co-text);
    font-family: var(--co-font-body);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  /* One screen, no scrolling: the whole point of this page is a single
     tap, and a payment page that has to be scrolled to find its button
     is a payment that does not happen. */
  .wrap {
    width: 100%; max-width: 360px; margin: auto;
    display: flex; flex-direction: column;
  }

  /* Header — the same logo, at the same size, as the sheet the viewer
     was just looking at. */
  .brand { display: flex; align-items: center; gap: var(--co-s2); margin-bottom: var(--co-s3); order: 0; }
  .brand img { width: 26px; height: 26px; object-fit: contain; }
  .brand span { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--co-text-muted); }

  /* The pass — the same shape the in-app sheet draws, so the hand-off
     to a browser doesn't feel like a hand-off to a different product. */
  .pass {
    background: var(--co-card);
    border: 1px solid var(--co-line);
    border-radius: var(--co-r-card);
    overflow: hidden;
    margin-bottom: var(--co-s3);
    box-shadow: var(--co-shadow-card);
  }
  .pass-band {
    display: flex; align-items: center; justify-content: space-between; gap: var(--co-s3);
    padding: 8px 14px; color: #fff;
    background-image: linear-gradient(135deg, var(--co-brand) 0%, var(--co-brand-deep) 100%);
  }
  .pass-title { font-family: var(--co-font-display); font-size: 11.5px; letter-spacing: .22em; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .06em; color: rgba(255,255,255,.85); }
  .pass-body { padding: var(--co-s3) var(--co-s4) var(--co-s4); }
  .pass-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--co-s3); }
  /* Plan on the left, total on the right, one line under the tear —
     the shape the in-app sheet's compact pass uses. */
  .amount-row { align-items: baseline; margin-top: var(--co-s1); }
  /* What to do, said once at the top — the same line the in-app sheet
     leads with, so a viewer handed over to the browser lands on the
     screen they just left rather than on a different one. */
  .pay-head {
    margin: 0 0 var(--co-s1); text-align: center;
    font-size: 15px; font-weight: 700; color: var(--co-text);
  }
  /* The plan, named quietly under the heading — same family, same
     weight class as the line above it, so the two read as one caption
     instead of as a headline with a price stapled to its side. */
  .pay-sub {
    margin: 2px 0 0; text-align: center;
    font-size: 12px; font-weight: 700; color: var(--co-text-dim);
  }
  .label { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--co-text-dim); margin: 0; }
  /* Khmer gets neither the caps nor the tracking. Khmer has no case, and
     letter-spacing inserts a gap between every glyph — in Khmer that
     means between a consonant and the vowel sign or coeng belonging to
     it, so "គម្រោង" comes apart into "គ ម្រោ ង". */
  :lang(km) .label, :lang(km) #orline { letter-spacing: normal; text-transform: none; font-size: 11px; }
  :lang(km) #orline { font-size: 10px; }
  .plan {
    font-size: 13px; font-weight: 700; margin: 0; color: var(--co-text);
    max-width: 58%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Amount and unit on one baseline, in the same proportion the app's
     sheet and the KHQR ticket use. Tabular figures so the digits don't
     shuffle sideways between plans. */
  .amount-wrap { display: flex; align-items: baseline; gap: 6px; }
  .amount {
    font-family: var(--co-font-display);
    font-size: 26px; line-height: 1; letter-spacing: .01em;
    font-variant-numeric: tabular-nums; margin: 0;
  }
  .amount-unit { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--co-text-dim); }

  /* No dark card around the code: the KHQR ticket is already a card,
     and wrapping a white card in a grey one just drew a second border
     around the one thing on the page that has to look official. */
  .tear {
    position: relative; margin: var(--co-s3) calc(-1 * var(--co-s4));
    border-top: 1px dashed rgba(255, 255, 255, 0.22);
  }
  .tear::before, .tear::after {
    content: ''; position: absolute; top: -8px; width: 16px; height: 16px;
    border-radius: var(--co-r-pill); background: var(--co-bg);
  }
  .tear::before { left: -8px; }
  .tear::after { right: -8px; }

  .qr-wrap { text-align: center; margin-top: var(--co-s3); }
  .qr-wrap img.qr-img {
    width: min(48vw, 186px); height: auto; border-radius: var(--co-r-btn);
    background: #fff; padding: 8px; display: inline-block;
  }
  .hint { font-size: 10.5px; line-height: 1.5; color: var(--co-text-dim); margin: var(--co-s2) auto 0; max-width: 17rem; }
  .desktop-hint { display: none; }

  /* KHQR ticket drawn around a generated QR — mirrors KhqrCard.tsx,
     down to the type scale. A QR only has to be big enough for a second
     phone's camera; past that it stops being a code and starts being
     wallpaper, pushing the pay button off the screen. */
  .khqr-ticket {
    width: min(48vw, 186px); min-width: 156px; margin: 0 auto;
    background: #fff; border-radius: 14px; overflow: hidden; text-align: left;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .khqr-ticket .band {
    background: #e11b24; padding: 6px 12px;
    clip-path: polygon(0 0, 100% 0, 100% 55%, 88% 100%, 0 100%);
  }
  .khqr-ticket .band p { margin: 0; text-align: center; color: #fff; font-size: 11.5px; font-weight: 900; letter-spacing: .14em; }
  .khqr-ticket .body { padding: 8px 12px 12px; }
  /* Name on top, amount on the line beneath it — the order a
     bank-issued KHQR ticket prints them in, which is the only order
     this ticket is allowed to use: its whole job is to be
     indistinguishable from the real thing. */
  .khqr-ticket .name {
    margin: 0;
    font-size: 11.5px; font-weight: 700; color: #1a1a1a;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .khqr-ticket .price {
    margin: 0; white-space: nowrap;
    font-size: 17px; font-weight: 800; color: #111; line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .khqr-ticket .price span { font-size: 10.5px; font-weight: 600; color: #8a8a8a; margin-left: 4px; }
  .khqr-ticket hr { border: 0; border-top: 1px dashed #dcdcdc; margin: 8px 0; }
  .khqr-ticket canvas { width: 100%; height: auto; display: block; background: #fff; padding: 0; border-radius: 0; }

  a.btn, button.btn {
    display: flex; align-items: center; justify-content: center; gap: var(--co-s2);
    width: 100%; max-width: 250px; margin: 0 auto var(--co-s2);
    min-height: 46px; border: 0; cursor: pointer;
    border-radius: var(--co-r-btn); padding: 12px 16px;
    font-family: inherit; font-size: 13.5px; font-weight: 800;
    text-decoration: none;
    transition: filter 180ms ease, transform 180ms ease;
  }
  a.btn:active, button.btn:active { transform: scale(.985); }
  .btn-primary {
    color: #fff;
    background-image: linear-gradient(135deg, var(--co-brand) 0%, var(--co-brand-deep) 100%);
    box-shadow: var(--co-shadow-btn);
  }
  .btn-ghost {
    color: var(--co-text-muted); background: rgba(255,255,255,.04);
    border: 1px solid var(--co-line); font-size: 12.5px; min-height: 42px;
  }
  /* ABA blue, used on nothing but the PayWay fallback. */
  .btn-aba {
    color: #cfdcf8; background: var(--co-aba-soft);
    border: 1px solid var(--co-aba-line); font-size: 13px;
  }

  /* Three steps, one line: on a page whose whole job is a single tap,
     a numbered list in its own card was buying instructions with the
     space the button needed. */
  .steps {
    margin: 2px 0 var(--co-s2); text-align: center;
    font-size: 10.5px; line-height: 1.5; color: var(--co-text-faint);
  }

  /* Warnings are amber, never red: red is the pay button on this page. */
  .note {
    display: none; margin-bottom: var(--co-s3);
    border: 1px solid var(--co-amber-line); background: var(--co-amber-soft);
    border-radius: var(--co-r-card); padding: var(--co-s3) var(--co-s4);
    font-size: 12px; color: var(--co-amber);
  }
  .note.show { display: block; }

  .err { font-size: 13px; color: var(--co-amber); text-align: center; }
  .back-hint { display: none; order: 8; margin-top: 0; font-size: 10.5px; color: var(--co-text-faint); text-align: center; }
  .back-hint.show { display: block; }
  .foot { margin-top: var(--co-s2); text-align: center; font-size: 9px; color: var(--co-text-faint); }

  /* Which half leads. Paying by ABA, the tap is the whole page and the
     QR is the fallback underneath it; paying from another bank's app,
     the QR IS the page and the ABA button drops to a quiet alternative. */
  #pass { order: 1; }
  #orline { order: 2; }
  #open-aba { order: 3; }
  #save-qr { order: 3; }
  #not-open { order: 4; }
  #payway { order: 5; }
  #steps-card { order: 6; }
  #back { order: 7; }
  #app-again { order: 8; }
  #err, .foot { order: 9; }

  #app-again {
    display: none; text-align: center; padding: 6px;
    font-size: 12px; font-weight: 700; color: var(--co-aba);
    text-decoration: underline; text-underline-offset: 3px;
  }
  #app-again.show { display: block; }

  /* Scanning and tapping are two ways to do the same thing, so the page
     says so out loud instead of stacking two buttons. */
  #orline {
    display: flex; align-items: center; gap: var(--co-s3);
    /* width:100% is not redundant. `.wrap` is a column flex container,
       and an auto left/right margin cancels the default stretch — so
       without it this shrank to fit the word "or" and its two rules were
       laid out at zero width, which is why the divider was invisible. */
    width: 100%; margin: 2px auto var(--co-s2); max-width: 250px;
    font-size: 10px; letter-spacing: .12em; color: var(--co-text-faint);
  }
  #orline::before, #orline::after {
    content: ''; flex: 1; height: 1px; background: var(--co-line-strong);
  }
  /* Nobody reads three steps while holding a QR up to another phone. */
  .wrap.mode-qr #steps-card { display: none; }

  /* A short phone (or a landscape one) has no room to spare: give the
     code back some of it rather than pushing the button off the fold. */
  @media (max-height: 700px) {
    .khqr-ticket, .qr-wrap img.qr-img { width: min(40vw, 150px); min-width: 132px; }
    .amount { font-size: 23px; }
    .pass-body { padding: var(--co-s3) var(--co-s3) var(--co-s3); }
    .foot { margin-top: var(--co-s1); }
    .brand { margin-bottom: var(--co-s2); }
    .pay-head { font-size: 14px; }
    .qr-wrap { margin-top: var(--co-s2); }
    .hint { margin-top: var(--co-s1); }
    .steps { margin: 0 0 var(--co-s1); }
    #orline { margin-bottom: var(--co-s1); }
  }

  /* Opened on a laptop: the deeplink is useless there, so the QR becomes
     the whole point and grows to something a phone can actually scan. */
  @media (min-width: 720px) and (pointer: fine) {
    .qr-wrap img.qr-img { width: 260px; }
    .khqr-ticket { width: 260px; }
    .desktop-hint { display: block; }
  }
  @media (prefers-reduced-motion: reduce) {
    a.btn, button.btn { transition: none; }
  }
</style>
<!--
  qrcode-bundle.js is the `qrcode` npm package bundled to a standalone IIFE
  (it ships no browser build), exposing window.renderKhqrCanvas. Rebuild with:
    node_modules/.bin/esbuild <entry>.js --bundle --minify --format=iife \
      --target=es2018 --outfile=public/pay/qrcode-bundle.js
  where <entry>.js imports QRCode from 'qrcode' and assigns the helper.
  It exists because this page has to draw a QR from a payload without a
  bundler: a rendered data URL is far too long to pass in a query string.
-->
<script src="./qrcode-bundle.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="/assets/images/logo-transparent.png" alt="" />
    <span id="brand-name">NINT ANIME VIP</span>
  </div>

  <!-- One card, the same object the app's sheet shows: a red band with
       the reference, what is being paid, then the code itself. -->
  <div class="pass" id="pass" hidden>
    <div class="pass-band">
      <span class="pass-title">VIP PASS</span>
      <span class="mono" id="ticket"></span>
    </div>
    <div class="pass-body">
      <!-- Same order the in-app sheet uses: what to do, a tear, then
           what it costs. The labelled "PLAN / AMOUNT DUE" rows this
           replaces said out loud what the two figures already are. -->
      <p class="pay-head" id="pay-head"></p>
      <p class="pay-sub" id="pay-sub" hidden></p>

      <div class="tear"></div>

      <!-- Only for a payment with no KHQR ticket under it (an uploaded
           QR image, or a code that failed to draw). When the ticket is
           there it prints the amount itself, and a display figure this
           size beside a small Khmer plan name, directly above a second
           copy of the same number, was two kinds of type arguing over
           one figure. -->
      <div class="pass-row amount-row" id="amount-row" hidden>
        <span class="plan" id="plan"></span>
        <span class="amount-wrap">
          <span class="amount" id="amount"></span>
          <span class="amount-unit" id="amount-unit"></span>
        </span>
      </div>

      <div class="qr-wrap" id="qr-card" hidden>
        <img class="qr-img" id="qr" alt="KHQR" hidden />
        <div class="khqr-ticket" id="qr-ticket" hidden>
          <div class="band"><p>KHQR</p></div>
          <div class="body">
            <p class="name" id="qr-name"></p>
            <p class="price" id="qr-price"></p>
            <hr />
            <canvas id="qr-canvas"></canvas>
          </div>
        </div>
        <p class="hint" id="qr-hint"></p>
        <p class="hint desktop-hint" id="qr-desktop-hint"></p>
      </div>
    </div>
  </div>

  <div class="note" id="not-open">
    <span id="not-open-text"></span>
  </div>

  <div id="orline" hidden><span id="or-label"></span></div>

  <a class="btn btn-primary" id="open-aba" hidden rel="noreferrer">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10.5 5.2h3"/><circle cx="12" cy="18.4" r="1.2"/></svg>
    <span id="open-aba-label"></span>
  </a>

  <!-- PayWay: the bank's own web checkout, kept in reserve and only
       offered once the deeplink has demonstrably failed to open ABA. -->
  <a class="btn btn-aba" id="payway" hidden rel="noreferrer" target="_blank">
    <span id="payway-label"></span>
  </a>

  <!-- The route that works for another bank's KHQR: take the code with
       you, then scan it from inside the bank app. -->
  <a class="btn btn-primary" id="save-qr" hidden download="khqr.png">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 19h16"/></svg>
    <span id="save-qr-label"></span>
  </a>

  <p class="steps" id="steps-card" hidden><span id="steps"></span></p>

  <a class="btn btn-ghost" id="back" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    <span id="back-label"></span>
  </a>


  <a class="app-again" id="app-again" hidden rel="noreferrer"></a>
  <p class="hint back-hint" id="back-hint"></p>

  <p class="err" id="err" hidden></p>
  <p class="foot" id="foot"></p>
</div>

<script>
(function () {
  var STRINGS = {
    km: {
      headScan: 'ស្កេនដើម្បីទូទាត់',
      headAba: 'ត្រៀមទូទាត់',
      saveQr: 'រក្សាទុករូប QR',
      stepsScan: ['រក្សាទុក QR', 'បើក App ធនាគារ', 'ស្កេនរូបពីវិចិត្រសាល'],
      qrHintSave: 'រក្សាទុក ឬថតអេក្រង់ QR នេះ រួចបើក App ធនាគាររបស់អ្នក ហើយស្កេនវាពីវិចិត្រសាល។',
      openAba: 'បើក App ABA',
      or: 'ឬ',
      payway: 'បើកទំព័រ ABA PayWay ជំនួស',
      qrHint: 'ឬស្កេន QR នេះដោយ App ធនាគាររបស់អ្នក',
      qrHintScan: 'ថតអេក្រង់ QR នេះទុក រួចស្កេនវាពី App ធនាគាររបស់អ្នក',
      openAbaAlt: 'ប្រើ ABA Mobile ជំនួស',
      qrDesktopHint: 'បើកលើកុំព្យូទ័រ? សូមស្កេន QR នេះដោយទូរស័ព្ទ។',
      openAppAgain: 'បើក Mini App ម្ដងទៀត',
      back: 'ត្រឡប់ទៅ App',
      backHint: 'បើមិនត្រឡប់ទេ សូមចុច «Done» ឬព្រួញថយក្រោយ នៅជ្រុងខាងលើ។',
      notOpen: 'ABA មិនបានបើកទេ។ សូមប្រើជម្រើសខាងក្រោម ឬស្កេន QR ខាងលើ។',
      steps: ['បើក ABA', 'បញ្ជាក់ការទូទាត់', 'ផ្ញើវិក្កយបត្រ'],
      missing: 'តំណទូទាត់មិនត្រឹមត្រូវ។ សូមត្រឡប់ទៅ App ហើយចាប់ផ្តើមឡើងវិញ។',
      foot: 'ការទូទាត់ដោយសុវត្ថិភាព · ដំណើរការដោយ KHQR · Bakong',
    },
    en: {
      headScan: 'Scan to pay',
      headAba: 'Ready to pay',
      saveQr: 'Save the QR image',
      stepsScan: ['Save the QR', 'Open your bank app', 'Scan it from your gallery'],
      qrHintSave: 'Save or screenshot this QR, then open your banking app and scan it from your gallery.',
      openAba: 'Open the ABA app',
      or: 'OR',
      payway: 'Open the ABA PayWay page instead',
      qrHint: 'Or scan this QR with your own banking app',
      qrHintScan: 'Screenshot this QR, then scan it from your banking app',
      openAbaAlt: 'Use ABA Mobile instead',
      qrDesktopHint: 'On a computer? Scan this QR with your phone.',
      openAppAgain: 'Open the Mini App again',
      back: 'Back to the app',
      backHint: 'Nothing happened? Use "Done" or the back arrow at the top of the screen.',
      notOpen: 'ABA did not open. Use the option below, or scan the QR above.',
      steps: ['Open ABA', 'Confirm', 'Send the receipt'],
      missing: 'This payment link is incomplete. Please go back to the app and start again.',
      foot: 'Secured checkout · Powered by KHQR · Bakong',
    },
  };

  var params = new URLSearchParams(window.location.search);
  var lang = params.get('lang') === 'en' ? 'en' : 'km';
  var t = STRINGS[lang];
  document.documentElement.lang = lang;

  var khqr = params.get('khqr');
  var qr = params.get('qr');
  var plan = params.get('plan');
  var amount = params.get('amount');
  var ticket = params.get('ticket');
  // What unit the figure is in. Sent explicitly now; older links only
  // carried a formatted string like "$2" or "៛4,000", so fall back to
  // reading the symbol off the front of it rather than assuming dollars
  // — printing "USD" next to a riel figure is the one label on this
  // screen a payer has to be able to trust.
  var currency = (params.get('cur') || '').toUpperCase();
  if (currency !== 'USD' && currency !== 'KHR') {
    currency = /^\s*៛/.test(amount || '') ? 'KHR' : 'USD';
  }
  // The digits alone — the unit is printed as its own element beside
  // them, at its own size, on both the pass and the KHQR ticket.
  var amountValue = (amount || '').replace(/^\s*[$៛]\s*/, '').replace(/\s*(USD|KHR)\s*$/i, '');
  var payLink = params.get('pay');
  var ret = params.get('ret');
  // Where to relaunch the Mini App if bringing Telegram forward didn't
  // land them back on it — a last resort, since it starts a fresh
  // instance rather than returning to the ticket they left open.
  var appLink = params.get('app');
  // 'qr' = someone paying from another bank's app: the QR leads and the
  // ABA button steps down to a quiet alternative. Anything else is the
  // ABA route, where the tap is the whole page.
  var mode = params.get('mode') === 'qr' ? 'qr' : 'aba';

  // Which bank issued this code. Sub-tag 00 of the merchant-account
  // field (tag 29 individual / tag 30 merchant) holds a Bakong handle
  // whose domain names the member bank: khqr@aclb is ACLEDA, khqr@abaa
  // is ABA. Same reading as readKhqrIssuer() in src/lib/khqr.ts.
  function tlv(payload) {
    var out = {}, i = 0;
    while (i + 4 <= payload.length) {
      var tag = payload.slice(i, i + 2);
      var len = parseInt(payload.slice(i + 2, i + 4), 10);
      if (!isFinite(len) || len < 0) break;
      var value = payload.slice(i + 4, i + 4 + len);
      if (value.length < len) break;
      if (!(tag in out)) out[tag] = value;
      i += 4 + len;
    }
    return out;
  }
  function khqrIssuer(payload) {
    if (!payload) return null;
    var top = tlv(payload);
    var account = top['29'] || top['30'];
    if (!account) return null;
    var handle = tlv(account)['00'];
    if (!handle) return null;
    var at = handle.indexOf('@');
    return at === -1 ? null : handle.slice(at + 1).trim().toLowerCase() || null;
  }
  // PayWay's handler validates the merchant data as its own, so it
  // refuses another bank's KHQR outright ("Invalid Qr Merchant Data")
  // while ABA's scanner -- a different code path -- reads the same
  // payload and pays it. An unreadable issuer keeps the old behaviour
  // rather than dropping the button on a payload this simply failed to
  // parse.
  function abaCanOpen(payload) {
    var issuer = khqrIssuer(payload);
    return issuer === null || issuer.indexOf('aba') === 0;
  }

  function el(id) { return document.getElementById(id); }
  function show(node) { node.hidden = false; }

  var wrap = document.querySelector('.wrap');
  wrap.className = 'wrap mode-' + mode;

  el('foot').textContent = t.foot;
  el('back-hint').textContent = t.backHint;

  // The pass is always shown — even a link missing its labels still has
  // the code in it, and an empty page would tell the viewer nothing.
  // Without a hand-off to a bank app, scanning IS the payment, whatever
  // route brought the viewer here.
  el('pay-head').textContent =
    mode === 'qr' || !abaCanOpen(khqr) ? t.headScan : t.headAba;

  // A KHQR payload with no uploaded image is the case that gets a drawn
  // ticket, and that ticket prints the amount itself.
  var ticketMode = !qr && !!khqr;

  // Filled either way; which of the two is revealed depends on whether
  // the ticket below will be carrying the figure.
  el('pay-sub').textContent = plan || '';
  el('plan').textContent = plan || '—';
  el('amount').textContent = amountValue || '';
  el('amount-unit').textContent = amountValue ? currency : '';

  // Falls back to the full amount row if the code never draws, so the
  // total can't vanish with it.
  var showAmountRow = function () {
    el('pay-sub').hidden = true;
    show(el('amount-row'));
  };
  if (ticketMode) {
    if (plan) show(el('pay-sub'));
  } else {
    showAmountRow();
  }
  el('ticket').textContent = ticket || '';
  show(el('pass'));

  if (qr) {
    // An uploaded QR image: show it as-is.
    var img = el('qr');
    img.addEventListener('error', function () { el('qr-card').hidden = true; });
    img.src = qr;
    img.hidden = false;
    el('qr-hint').textContent = mode === 'qr' ? t.qrHintScan : t.qrHint;
    el('qr-desktop-hint').textContent = t.qrDesktopHint;
    show(el('qr-card'));
  } else if (khqr) {
    // A generated KHQR: draw it here from the payload. The encoder loads
    // with `defer`, so it may not be ready yet on a slow connection.
    // The small round Bakong mark every real KHQR carries dead centre.
    // Same asset and same proportions the in-app sheet draws (see
    // drawKhqrBadge in src/lib/bakong.ts) — without it the code this
    // page shows was visibly a different object from the one the sheet
    // had just shown, on the screen where that matters most. The 'H'
    // error correction the encoder uses survives ~30% obscured; this
    // covers about 20%.
    var drawBadge = function (canvas) {
      return new Promise(function (done) {
        var ctx = canvas.getContext('2d');
        if (!ctx) return done();
        var cx = canvas.width / 2;
        var cy = canvas.height / 2;
        var outerR = canvas.width * 0.1;

        // A soft shadow, the way a printed sticker badge sits slightly
        // proud of the page rather than pasted flat onto it.
        ctx.fillStyle = 'rgba(0,0,0,0.16)';
        ctx.beginPath();
        ctx.arc(cx, cy + outerR * 0.05, outerR * 1.04, 0, Math.PI * 2);
        ctx.fill();

        // A white ring behind the mark: the source file's red disc runs
        // edge to edge, so without this it would sit flush against
        // whatever QR module happens to be behind it.
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
        ctx.fill();

        var size = outerR * 1.55;
        var mark = new Image();
        mark.onload = function () {
          ctx.drawImage(mark, cx - size / 2, cy - size / 2, size, size);
          done();
        };
        mark.onerror = function () {
          // Asset missing (bad deploy, offline first paint): a plain red
          // disc still reads as "this has a badge" rather than leaving a
          // blank white hole punched in the code.
          ctx.fillStyle = '#E11B24';
          ctx.beginPath();
          ctx.arc(cx, cy, outerR * 0.86, 0, Math.PI * 2);
          ctx.fill();
          done();
        };
        mark.src = '/assets/bakong-mark.png';
      });
    };

    var drawQr = function () {
      if (!window.renderKhqrCanvas) return false;
      var canvas = el('qr-canvas');
      window.renderKhqrCanvas(canvas, khqr).then(function () {
        return drawBadge(canvas);
      }).then(function () {
        // The encoder writes its own inline width/height on the canvas
        // (408px, whatever the payload needs), and an inline style beats
        // the stylesheet — which is why the ticket used to burst out of
        // its card and push the pay button off the screen. Hand the
        // sizing back to CSS now that the pixels are drawn.
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        var name = params.get('name');
        if (name) el('qr-name').textContent = name;
        // The ticket prints the figure the way a bank prints it — the
        // same digits and the same unit the pass above it shows, so the
        // two can never appear to disagree.
        if (amountValue) {
          el('qr-price').textContent = amountValue;
          var unit = document.createElement('span');
          unit.textContent = currency;
          el('qr-price').appendChild(unit);
        }
        el('qr-ticket').hidden = false;
        // Now that pixels exist there is something to save. A data URL
        // download works in Android Chrome; where the browser opens the
        // image instead of saving it, long-pressing it still saves, and
        // the hint below offers a screenshot either way.
        if (!abaCanOpen(khqr)) {
          try {
            el('save-qr').href = canvas.toDataURL('image/png');
            show(el('save-qr'));
          } catch (e) {
            // Tainted or oversized canvas: the hint alone still works.
          }
        }
        el('qr-hint').textContent = !abaCanOpen(khqr)
          ? t.qrHintSave
          : mode === 'qr' ? t.qrHintScan : t.qrHint;
        el('qr-desktop-hint').textContent = t.qrDesktopHint;
        show(el('qr-card'));
      }).catch(function () {
        // No QR to scan — the deeplink button below is still the main
        // path, but nothing is now printing the amount, so the pass has
        // to say it again.
        showAmountRow();
      });
      return true;
    };
    if (!drawQr()) window.addEventListener('load', drawQr);
  }

  if (khqr && abaCanOpen(khqr)) {
    // Same formula as buildAbaDeeplink() in src/lib/khqr.ts.
    var deeplink = 'abamobilebank://ababank.com?type=payway&qrcode=' + encodeURIComponent(khqr);

    var link = el('open-aba');
    // A REAL anchor with a real href — never a scripted location.href.
    // A browser hands a custom scheme to the OS on a genuine link tap;
    // a scripted navigation to the same string is what gets swallowed.
    link.href = deeplink;
    // On the QR route the bank hand-off is still offered — some people
    // scan, some tap — but it must not look like the main event.
    if (mode === 'qr') {
      link.className = 'btn btn-aba';
      el('open-aba-label').textContent = t.openAbaAlt;
    } else {
      el('open-aba-label').textContent = t.openAba;
    }
    show(link);
    el('or-label').textContent = t.or;
    show(el('orline'));

    el('not-open-text').textContent = t.notOpen;

    if (payLink) {
      el('payway-label').textContent = t.payway;
      el('payway').href = payLink;
    }

    // There is no success callback for a scheme hand-off, so the only
    // reliable signal is this page losing the foreground. Arm the
    // watchers on the tap; if we are still visible after the grace
    // period, nothing opened — and only THEN is PayWay offered, so the
    // bank's own web checkout never competes with the one-tap route.
    // The navigation itself belongs to the browser: this never navigates
    // on its own, and never on load, because iOS only honours the scheme
    // from a real user tap.
    link.addEventListener('click', function () {
      var handled = false;
      var mark = function () { handled = true; };
      document.addEventListener('visibilitychange', mark, { once: true });
      window.addEventListener('pagehide', mark, { once: true });
      window.addEventListener('blur', mark, { once: true });
      window.setTimeout(function () {
        document.removeEventListener('visibilitychange', mark);
        window.removeEventListener('pagehide', mark);
        window.removeEventListener('blur', mark);
        if (!handled && document.visibilityState === 'visible') {
          el('not-open').classList.add('show');
          if (payLink) show(el('payway'));
        }
      }, 2000);
    });


    el('steps').textContent = t.steps
      .map(function (line, i) { return String(i + 1) + '. ' + line; })
      .join('  ·  ');
    show(el('steps-card'));
  } else if (khqr) {
    // Another bank's KHQR. There is no hand-off worth offering, so the
    // page says what does work: take the code with you and scan it from
    // inside the bank app. The href is set once the code has been drawn
    // (see drawQr) -- until then there is nothing to save.
    el('save-qr-label').textContent = t.saveQr;
    el('steps').textContent = t.stepsScan
      .map(function (line, i) { return String(i + 1) + '. ' + line; })
      .join('  ·  ');
    show(el('steps-card'));
  } else if (!qr) {
    var err = el('err');
    err.textContent = t.missing;
    show(err);
  }

  // The way home. `ret` is normally a t.me link that reopens the Mini
  // App; when the bot username isn't configured it is `tg://`, which at
  // least brings Telegram forward. Either way the button is always
  // there — this page is a dead end without it, since Telegram opened
  // it in a fresh tab with no history to go back to.
  var back = el('back');
  el('back-label').textContent = t.back;
  back.href = ret || 'tg://';
  if (appLink) {
    el('app-again').href = appLink;
    el('app-again').textContent = t.openAppAgain;
  }
  back.addEventListener('click', function () {
    // Nothing came to the front after a beat: Telegram is not installed,
    // or the scheme was refused. Offer the relaunch link and say where
    // the browser's own exit is, instead of leaving them tapping a
    // button that appears to do nothing.
    window.setTimeout(function () {
      if (document.visibilityState !== 'visible') return;
      el('back-hint').classList.add('show');
      if (appLink) el('app-again').classList.add('show');
    }, 1200);
  });
  show(back);
})();
</script>
</body>
</html>
