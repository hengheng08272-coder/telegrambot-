<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0D" />
<meta name="robots" content="noindex" />
<title>ទូទាត់ — NINT ANIME VIP</title>
<link rel="icon" type="image/png" href="/assets/images/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&family=Anton&display=swap" rel="stylesheet" />
<!-- The same tokens the in-app payment sheet is built from, loaded from
     the same file, so this page and the sheet are visibly one product. -->
<link rel="stylesheet" href="/checkout-theme.css" />
<!--
  Standalone checkout page, opened in the SYSTEM browser (Safari), not in
  Telegram's WebView.

  Why it exists: inside Telegram the Mini App runs in Telegram's own
  WebView, which routinely swallows a navigation to a non-http scheme. The
  abamobilebank:// deeplink therefore behaves "like text, not a link"
  there. Telegram's WebApp.openLink() does hand an https URL to the system
  browser, so the Mini App opens THIS page with openLink(), and the viewer
  taps the deeplink from Safari — where iOS honours it and launches ABA.

  Plain HTML on purpose: it must work with no bundler, no framework and no
  network call beyond its own assets. Everything it shows comes from the
  query string, and all of it is data the QR already encodes publicly.

  Params: khqr, qr, plan, amount, ticket, name, pay, ret, lang
-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { background: var(--co-bg); }
  body {
    margin: 0;
    padding: 20px 16px calc(32px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    background: var(--co-bg);
    background-image: var(--co-backdrop);
    background-repeat: no-repeat;
    color: var(--co-text);
    font-family: var(--co-font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 420px; margin: 0 auto; }

  /* Header — the same logo, at the same size, as the sheet the viewer
     was just looking at. */
  .brand { display: flex; align-items: center; gap: var(--co-s2); margin-bottom: var(--co-s4); }
  .brand img { width: 32px; height: 32px; object-fit: contain; }
  .brand span { font-size: 13px; font-weight: 700; color: var(--co-text); }

  .card {
    background: var(--co-card);
    border: 1px solid var(--co-line);
    border-radius: var(--co-r-card);
    padding: var(--co-s4);
    margin-bottom: var(--co-s3);
  }
  .label { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--co-text-dim); margin: 0; }
  .plan { font-size: 15px; font-weight: 700; margin: 2px 0 0; }
  .amount {
    font-family: var(--co-font-display);
    font-size: 44px; line-height: 1; letter-spacing: .01em;
    margin: var(--co-s2) 0 0;
  }
  .meta { font-size: 11px; color: var(--co-text-dim); margin: var(--co-s2) 0 0; }

  .qr-wrap { text-align: center; }
  .qr-wrap img.qr-img {
    width: 100%; max-width: 240px; height: auto; border-radius: var(--co-r-btn);
    background: #fff; padding: 8px; display: inline-block;
  }
  .hint { font-size: 12px; color: var(--co-text-muted); margin: var(--co-s3) 0 0; text-align: center; }
  .desktop-hint { display: none; }

  /* KHQR ticket drawn around a generated QR — mirrors KhqrCard.tsx. */
  .khqr-ticket {
    width: 100%; max-width: 240px; margin: 0 auto;
    background: #fff; border-radius: var(--co-r-btn); overflow: hidden; text-align: left;
  }
  .khqr-ticket .band {
    background: #e11b24; padding: 8px 12px;
    clip-path: polygon(0 0, 100% 0, 100% 55%, 88% 100%, 0 100%);
  }
  .khqr-ticket .band p { margin: 0; text-align: center; color: #fff; font-size: 14px; font-weight: 900; letter-spacing: .12em; }
  .khqr-ticket .body { padding: 10px 12px 12px; }
  .khqr-ticket .name { margin: 0; font-size: 13px; font-weight: 700; color: #1a1a1a; }
  .khqr-ticket .price { margin: 0; font-size: 19px; font-weight: 800; color: #1a1a1a; line-height: 1.2; }
  .khqr-ticket .price span { font-size: 12px; font-weight: 600; color: #6b6b6b; margin-left: 4px; }
  .khqr-ticket hr { border: 0; border-top: 1px dashed #d8d8d8; margin: 10px 0; }
  .khqr-ticket canvas { width: 100%; height: auto; display: block; background: #fff; padding: 0; border-radius: 0; }

  a.btn, button.btn {
    display: flex; align-items: center; justify-content: center; gap: var(--co-s2);
    width: 100%; min-height: 44px; border: 0; cursor: pointer;
    border-radius: var(--co-r-btn); padding: 15px 14px;
    font-family: inherit; font-size: 15px; font-weight: 800;
    text-decoration: none; margin-bottom: var(--co-s2);
    transition: filter 180ms ease, transform 180ms ease;
  }
  a.btn:active, button.btn:active { transform: scale(.985); }
  .btn-primary {
    color: #fff;
    background-image: linear-gradient(135deg, var(--co-brand) 0%, var(--co-brand-deep) 100%);
    box-shadow: var(--co-shadow-btn);
  }
  .btn-ghost {
    color: var(--co-text-muted); background: rgba(255,255,255,.04);
    border: 1px solid var(--co-line); font-size: 13px;
  }
  /* ABA blue, used on nothing but the PayWay fallback. */
  .btn-aba {
    color: #cfdcf8; background: var(--co-aba-soft);
    border: 1px solid var(--co-aba-line); font-size: 13px;
  }

  .steps { margin: 0; padding-left: 20px; font-size: 12px; color: var(--co-text-muted); }
  .steps li { margin-bottom: var(--co-s1); }

  /* Warnings are amber, never red: red is the pay button on this page. */
  .note {
    display: none; margin-bottom: var(--co-s3);
    border: 1px solid var(--co-amber-line); background: var(--co-amber-soft);
    border-radius: var(--co-r-card); padding: var(--co-s3) var(--co-s4);
    font-size: 12px; color: var(--co-amber);
  }
  .note.show { display: block; }

  details.help { margin-top: var(--co-s2); }
  details.help summary {
    list-style: none; cursor: pointer; text-align: center;
    font-size: 12px; font-weight: 700; color: var(--co-text-dim);
    padding: var(--co-s3);
  }
  details.help summary::-webkit-details-marker { display: none; }
  details.help .panel {
    border: 1px solid var(--co-line); border-radius: var(--co-r-card);
    padding: var(--co-s4); font-size: 12px; color: var(--co-text-muted);
  }
  code.deeplink {
    display: block; margin-top: var(--co-s2); word-break: break-all;
    font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--co-text-dim);
  }
  .err { font-size: 13px; color: var(--co-amber); text-align: center; }
  .foot { margin-top: var(--co-s4); text-align: center; font-size: 10px; color: var(--co-text-faint); }

  /* Opened on a laptop: the deeplink is useless there, so the QR becomes
     the whole point and grows to something a phone can actually scan. */
  @media (min-width: 720px) and (pointer: fine) {
    .qr-wrap img.qr-img, .khqr-ticket { max-width: 340px; }
    .desktop-hint { display: block; }
  }
  @media (prefers-reduced-motion: reduce) {
    a.btn, button.btn { transition: none; }
  }
</style>
<!--
  qrcode-bundle.js is the `qrcode` npm package bundled to a standalone IIFE
  (it ships no browser build), exposing window.renderKhqrCanvas. Rebuild with:
    node_modules/.bin/esbuild <entry>.js --bundle --minify --format=iife \
      --target=es2018 --outfile=public/pay/qrcode-bundle.js
  where <entry>.js imports QRCode from 'qrcode' and assigns the helper.
  It exists because this page has to draw a QR from a payload without a
  bundler: a rendered data URL is far too long to pass in a query string.
-->
<script src="./qrcode-bundle.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="/assets/images/logo-transparent.png" alt="" />
    <span id="brand-name">NINT ANIME VIP</span>
  </div>

  <div class="card" id="summary" hidden>
    <p class="label" id="plan-label"></p>
    <p class="plan" id="plan"></p>
    <p class="amount" id="amount"></p>
    <p class="meta" id="ticket"></p>
  </div>

  <div class="card qr-wrap" id="qr-card" hidden>
    <img class="qr-img" id="qr" alt="KHQR" hidden />
    <div class="khqr-ticket" id="qr-ticket" hidden>
      <div class="band"><p>KHQR</p></div>
      <div class="body">
        <p class="name" id="qr-name"></p>
        <p class="price" id="qr-price"></p>
        <hr />
        <canvas id="qr-canvas"></canvas>
      </div>
    </div>
    <p class="hint" id="qr-hint"></p>
    <p class="hint desktop-hint" id="qr-desktop-hint"></p>
  </div>

  <div class="note" id="not-open">
    <span id="not-open-text"></span>
  </div>

  <a class="btn btn-primary" id="open-aba" hidden rel="noreferrer">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>
    <span id="open-aba-label"></span>
  </a>

  <!-- PayWay: the bank's own web checkout, kept in reserve and only
       offered once the deeplink has demonstrably failed to open ABA. -->
  <a class="btn btn-aba" id="payway" hidden rel="noreferrer" target="_blank">
    <span id="payway-label"></span>
  </a>

  <div class="card" id="steps-card" hidden>
    <ol class="steps" id="steps"></ol>
  </div>

  <a class="btn btn-ghost" id="back" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    <span id="back-label"></span>
  </a>

  <details class="help" id="help" hidden>
    <summary id="help-summary"></summary>
    <div class="panel">
      <p style="margin:0" id="help-text"></p>
      <button class="btn btn-ghost" id="copy" style="margin-top:12px">
        <span id="copy-label"></span>
      </button>
      <a id="payway-alt" hidden style="display:block;font-size:12px;font-weight:700;color:var(--co-aba);text-decoration:underline;text-underline-offset:3px" rel="noreferrer" target="_blank"></a>
      <code class="deeplink" id="deeplink-text"></code>
    </div>
  </details>

  <p class="err" id="err" hidden></p>
  <p class="foot" id="foot"></p>
</div>

<script>
(function () {
  var STRINGS = {
    km: {
      planLabel: 'គម្រោង',
      openAba: 'បើក ABA Mobile',
      payway: 'បើកទំព័រ ABA PayWay ជំនួស',
      copy: 'ចម្លងលេខ KHQR',
      copied: 'បានចម្លង!',
      qrHint: 'ឬស្កេន QR នេះដោយ App ធនាគាររបស់អ្នក',
      qrDesktopHint: 'បើកលើកុំព្យូទ័រ? សូមស្កេន QR នេះដោយទូរស័ព្ទ។',
      ticket: 'លេខយោង',
      back: 'ខ្ញុំបានទូទាត់រួច — ត្រឡប់ទៅ App',
      notOpen: 'ABA មិនបានបើកទេ។ សូមប្រើជម្រើសខាងក្រោម ឬស្កេន QR ខាងលើ។',
      help: 'ABA មិនបើកទេ?',
      helpText: 'សូមប្រាកដថាបានដំឡើង App ABA Mobile រួច។ អ្នកអាចចម្លងលេខ KHQR ទៅបិទភ្ជាប់ក្នុង App ធនាគារ ឬស្កេន QR ខាងលើ។',
      steps: [
        'ចុច «បើក ABA Mobile» ខាងលើ',
        'បញ្ជាក់ការទូទាត់ក្នុង App ABA',
        'ត្រឡប់មក App ហើយផ្ញើរូបវិក្កយបត្រ',
      ],
      missing: 'តំណទូទាត់មិនត្រឹមត្រូវ។ សូមត្រឡប់ទៅ App ហើយចាប់ផ្តើមឡើងវិញ។',
      foot: 'ការទូទាត់ដោយសុវត្ថិភាព · ដំណើរការដោយ ABA PayWay KHQR',
    },
    en: {
      planLabel: 'Plan',
      openAba: 'Open ABA Mobile',
      payway: 'Open the ABA PayWay page instead',
      copy: 'Copy KHQR code',
      copied: 'Copied!',
      qrHint: 'Or scan this QR with your own banking app',
      qrDesktopHint: 'On a computer? Scan this QR with your phone.',
      ticket: 'Reference',
      back: "I've paid — back to the app",
      notOpen: 'ABA did not open. Use the option below, or scan the QR above.',
      help: "ABA didn't open?",
      helpText: 'Make sure ABA Mobile is installed. You can copy the KHQR code and paste it into your bank app, or scan the QR above.',
      steps: [
        'Tap "Open ABA Mobile" above',
        'Confirm the payment in the ABA app',
        'Come back to the app and send your receipt',
      ],
      missing: 'This payment link is incomplete. Please go back to the app and start again.',
      foot: 'Secured checkout · Powered by ABA PayWay KHQR',
    },
  };

  var params = new URLSearchParams(window.location.search);
  var lang = params.get('lang') === 'en' ? 'en' : 'km';
  var t = STRINGS[lang];
  document.documentElement.lang = lang;

  var khqr = params.get('khqr');
  var qr = params.get('qr');
  var plan = params.get('plan');
  var amount = params.get('amount');
  var ticket = params.get('ticket');
  var payLink = params.get('pay');
  var ret = params.get('ret');

  function el(id) { return document.getElementById(id); }
  function show(node) { node.hidden = false; }

  el('foot').textContent = t.foot;

  if (plan || amount) {
    el('plan-label').textContent = t.planLabel;
    el('plan').textContent = plan || '';
    el('amount').textContent = amount || '';
    if (ticket) el('ticket').textContent = t.ticket + ': ' + ticket;
    show(el('summary'));
  }

  if (qr) {
    // An uploaded QR image: show it as-is.
    var img = el('qr');
    img.addEventListener('error', function () { el('qr-card').hidden = true; });
    img.src = qr;
    img.hidden = false;
    el('qr-hint').textContent = t.qrHint;
    el('qr-desktop-hint').textContent = t.qrDesktopHint;
    show(el('qr-card'));
  } else if (khqr) {
    // A generated KHQR: draw it here from the payload. The encoder loads
    // with `defer`, so it may not be ready yet on a slow connection.
    var drawQr = function () {
      if (!window.renderKhqrCanvas) return false;
      window.renderKhqrCanvas(el('qr-canvas'), khqr).then(function () {
        var name = params.get('name');
        if (name) el('qr-name').textContent = name;
        // `amount` arrives already formatted for display (e.g. "$2.00");
        // the ticket prints it the way ABA does, as "2.00 USD".
        if (amount) {
          el('qr-price').innerHTML = amount.replace(/^\$/, '') + ' <span>USD</span>';
        }
        el('qr-ticket').hidden = false;
        el('qr-hint').textContent = t.qrHint;
        el('qr-desktop-hint').textContent = t.qrDesktopHint;
        show(el('qr-card'));
      }).catch(function () {
        // No QR to scan — the deeplink button below is still the main path.
      });
      return true;
    };
    if (!drawQr()) window.addEventListener('load', drawQr);
  }

  if (khqr) {
    // Same formula as buildAbaDeeplink() in src/lib/khqr.ts.
    var deeplink = 'abamobilebank://ababank.com?type=payway&qrcode=' + encodeURIComponent(khqr);

    var link = el('open-aba');
    // A REAL anchor with a real href — never a scripted location.href.
    // A browser hands a custom scheme to the OS on a genuine link tap;
    // a scripted navigation to the same string is what gets swallowed.
    link.href = deeplink;
    el('open-aba-label').textContent = t.openAba;
    show(link);

    el('deeplink-text').textContent = deeplink;
    el('not-open-text').textContent = t.notOpen;
    el('help-summary').textContent = t.help;
    el('help-text').textContent = t.helpText;
    show(el('help'));

    if (payLink) {
      el('payway-label').textContent = t.payway;
      el('payway').href = payLink;
      var alt = el('payway-alt');
      alt.href = payLink;
      alt.textContent = t.payway;
      alt.hidden = false;
      alt.style.display = 'block';
    }

    // There is no success callback for a scheme hand-off, so the only
    // reliable signal is this page losing the foreground. Arm the
    // watchers on the tap; if we are still visible after the grace
    // period, nothing opened — and only THEN is PayWay offered, so the
    // bank's own web checkout never competes with the one-tap route.
    // The navigation itself belongs to the browser: this never navigates
    // on its own, and never on load, because iOS only honours the scheme
    // from a real user tap.
    link.addEventListener('click', function () {
      var handled = false;
      var mark = function () { handled = true; };
      document.addEventListener('visibilitychange', mark, { once: true });
      window.addEventListener('pagehide', mark, { once: true });
      window.addEventListener('blur', mark, { once: true });
      window.setTimeout(function () {
        document.removeEventListener('visibilitychange', mark);
        window.removeEventListener('pagehide', mark);
        window.removeEventListener('blur', mark);
        if (!handled && document.visibilityState === 'visible') {
          el('not-open').classList.add('show');
          if (payLink) show(el('payway'));
          el('help').open = true;
        }
      }, 2000);
    });

    var copy = el('copy');
    el('copy-label').textContent = t.copy;
    copy.addEventListener('click', function () {
      var done = function () {
        el('copy-label').textContent = t.copied;
        window.setTimeout(function () { el('copy-label').textContent = t.copy; }, 1600);
      };
      function fallbackCopy() {
        // Older in-app WebViews have no clipboard API.
        var box = document.createElement('textarea');
        box.value = khqr;
        box.setAttribute('readonly', '');
        box.style.position = 'fixed';
        box.style.opacity = '0';
        document.body.appendChild(box);
        box.select();
        try { document.execCommand('copy'); done(); } catch (e) { /* nothing else to try */ }
        document.body.removeChild(box);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(khqr).then(done, fallbackCopy);
      } else {
        fallbackCopy();
      }
    });

    var steps = el('steps');
    t.steps.forEach(function (line) {
      var li = document.createElement('li');
      li.textContent = line;
      steps.appendChild(li);
    });
    show(el('steps-card'));
  } else if (!qr) {
    var err = el('err');
    err.textContent = t.missing;
    show(err);
  }

  if (ret) {
    var back = el('back');
    back.href = ret;
    el('back-label').textContent = t.back;
    show(back);
  }
})();
</script>
</body>
</html>
